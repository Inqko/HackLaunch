name: AI Project Progress Tracker

on:
  pull_request:
    types: [opened, closed, synchronize]
  workflow_dispatch:

jobs:
  track-progress:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-genai

      - name: Analyze progress & comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - << 'EOF'
          import os, json, subprocess
          from google import genai

          repo = os.environ.get('REPO')
          pr_num = os.environ.get('PR_NUMBER')
          api_key = os.environ.get('GEMINI_API_KEY')

          if not api_key:
              raise ValueError("GEMINI_API_KEY не найден в Secrets!")

          # 1. Получаем список Issues
          try:
              issues_raw = subprocess.check_output(
                  ["gh", "issue", "list", "--repo", repo, "--state", "all", "--json", "number,title,state,body"]
              )
              issues = json.loads(issues_raw)
          except Exception:
              issues = []

          # 2. Получаем коммиты
          try:
              commits_raw = subprocess.check_output(
                  ["git", "log", "-n", "10", "--oneline"]
              ).decode('utf-8')
          except Exception:
              commits_raw = "Нет коммитов в ветке."

          context = f"=== ISSUES / TASKS ===\n{json.dumps(issues, ensure_ascii=False, indent=2)}\n\n"
          context += f"=== RECENT COMMITS ===\n{commits_raw}"

          # 3. Запрос через официальный SDK google-genai
          client = genai.Client(api_key=api_key)

          prompt = f"""
          Ты — AI-ассистент команды на 7-часовом хакатоне.
          Оцени текущий прогресс проекта на основе задач и коммитов:
          {context}

          Сделай краткую, емкую сводку:
          1. 📊 Текущий процент готовности проекта (оценка).
          2. ✅ Что уже сделано.
          3. ⏳ Что сейчас в процессе и что осталось сделать.
          4. ⚠️ Риски/блокеры (на что обратить внимание, учитывая жесткий дедлайн).
          Формат: Markdown. Не пиши лишней воды, держи фокус на дедлайне.
          """

          response = client.models.generate_content(
              model='gemini-2.5-flash',
              contents=prompt
          )

          report = f"### 🤖 Отчет ИИ-трекера прогресса\n\n{response.text}"
          print(report)

          # Добавляем отчет в GitHub Actions Step Summary (будет виден на странице запуска)
          summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'a', encoding='utf-8') as f:
                  f.write(report + "\n")

          # Если это PR — комментируем в ветку
          if pr_num:
              subprocess.run(["gh", "pr", "comment", pr_num, "--repo", repo, "--body", report])
          EOF